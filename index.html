<section class="collection-section section-pad container" id="collection">${sectionHeading('THE SIGNATURE EDIT','Find your <em>forever scent.</em>','An intimate collection of fragrances, each with a world of its own.')}<div class="collection-tabs"><button class="filter-pill active" data-action="home-filter" data-filter="All">ALL SCENTS</button><button class="filter-pill" data-action="home-filter" data-filter="Floral">FLORAL & SOFT</button><button class="filter-pill" data-action="home-filter" data-filter="Woody">DARK & WOODY</button><button class="filter-pill" data-action="home-filter" data-filter="Amber">WARM & AMBER</button></div><div class="product-grid" id="home-products">${PRODUCTS.map(productCard).join('')}</div><div class="center-action"><a class="text-link" href="?page=shop" data-nav="shop">SHOP ALL FRAGRANCES <span>${ic('arrow',19)}</span></a></div></section>
<section class="editorial-feature"><div class="editorial-photo"><img src="assets/photo-6.webp" loading="lazy" alt="Editorial fragrance campaign portrait"/><span class="photo-index">NÉRAVIE / CAMPAIGN 001</span></div><div class="editorial-copy"><span class="eyebrow gold">THE ART OF FEELING</span><div class="editorial-rule"></div><h2>More than<br/>a scent. <em>A<br/>state of mind.</em></h2><p>There are moments you remember. And moments that remember you. We create for the latter — for presence, expression, and every unspoken thing in between.</p><a data-nav="story" href="?page=story" class="light-link">ENTER OUR WORLD ${ic('arrow',20)}</a><span class="editorial-small">THE MAISON / 01</span></div></section>
<section class="discovery-section container section-pad"><div class="discovery-intro"><div><span class="eyebrow">DISCOVER YOUR NOTE</span><h2>The scent of<br/><em>your story.</em></h2></div><div><p>Some days call for something luminous. Others for a little darkness. Whatever your mood, there is a fragrance that feels like it was waiting for you.</p><button class="text-link" data-action="quiz">FIND MY FRAGRANCE ${ic('arrow',19)}</button></div></div><div class="scent-grid"><button class="scent-tile" data-action="category" data-filter="Woody"><img src="assets/photo-2.webp" loading="lazy" alt="Woody fragrance bottle"/><span><small>01 / THE INTENSE</small><strong>Dark & daring</strong>${ic('arrow',23)}</span></button><button class="scent-tile" data-action="category" data-filter="Floral"><img src="assets/photo-3.webp" loading="lazy" alt="Floral fragrance bottle"/><span><small>02 / THE ROMANTIC</small><strong>Soft & luminous</strong>${ic('arrow',23)}</span></button><button class="scent-tile" data-action="category" data-filter="Amber"><img src="assets/photo-4.webp" loading="lazy" alt="Amber fragrance bottle"/><span><small>03 / THE WARM</small><strong>Golden & glowing</strong>${ic('arrow',23)}</span></button></div></section>
<section class="signature-banner"><div class="signature-left"><span class="eyebrow gold">THE AFTER-HOURS EDIT</span><h2>A little<br/><em>indulgence.</em><br/>A lasting<br/>impression.</h2><p>Meet Rouge Privé. Deep, decadent, and impossible to ignore.</p><a class="button gold-button" href="?page=product&id=rouge" data-nav="product" data-id="rouge">MEET ROUGE PRIVÉ ${ic('arrow',18)}</a></div><div class="signature-right"><img src="assets/photo-5.webp" loading="lazy" alt="NÉRAVIE Rouge Privé on burgundy velvet"/></div></section>

function story(){return `<main class="story-page"><section class="story-hero"><div><span class="eyebrow gold">WELCOME TO THE MAISON</span><h1>We believe in<br/><em>the unforgettable.</em></h1><p>A fragrance house devoted to the beauty of a lasting impression.</p></div></section><section class="story-split container section-pad"><div><span class="eyebrow">OUR POINT OF VIEW</span><h2>Not louder.<br/><em>More lasting.</em></h2></div><div><p>At NÉRAVIE, perfume is the most intimate accessory. Invisible and yet entirely expressive. An extension of who you are, where you have been, and every beautiful possibility ahead.</p><p>Our collection was imagined as a wardrobe of feelings — from bright morning light to a room after midnight. There is no single way to wear a story. Only your way.</p><a class="text-link" href="?page=shop" data-nav="shop">EXPLORE THE COLLECTION ${ic('arrow',19)}</a></div></section><section class="story-images"><img src="assets/photo-6.webp" alt="NÉRAVIE campaign portrait" loading="lazy"/><img src="assets/photo-4.webp" alt="NÉRAVIE amber fragrance" loading="lazy"/><img src="assets/photo-7.webp" alt="NÉRAVIE editorial portrait" loading="lazy"/></section><section class="story-manifesto section-pad"><span class="eyebrow gold">OUR PHILOSOPHY</span><h2>We don't just wear fragrance.<br/><em>We carry memories.</em></h2><p>THIS IS THE WORLD OF NÉRAVIE.</p></section></main>`}

document.addEventListener('click',e=>{const link=e.target.closest('[data-nav]');if(link){e.preventDefault();closePanels();const extras={};if(link.dataset.id)extras.id=link.dataset.id;else{const u=new URL(link.href,location.href);if(u.searchParams.has('family'))extras.family=u.searchParams.get('family')}nav(link.dataset.nav,extras);return}
const el=e.target.closest('[data-action]');if(!el){if(e.target.id==='overlay')closePanels();return}e.preventDefault();const a=el.dataset.action,id=el.dataset.id;
switch(a){case 'cart':showDrawer('cart');break;case 'wishlist':showDrawer('wishlist');break;case 'menu':showDrawer('menu');break;case 'search':searchModal();break;case 'close':closePanels();break;case 'favorite':toggleFavorite(id);break;case 'quick-add':addToBag(id);break;case 'detail-add':addToBag(id,selectedSize,detailQty);break;case 'buy-now':{const existing=cart.find(x=>x.id===id&&x.size===selectedSize);if(existing)existing.qty=Math.min(99,existing.qty+detailQty);else cart.push({id,size:selectedSize,qty:detailQty});saveState();closePanels();nav('checkout');break;}case 'detail-qty':detailQty=Math.max(1,Math.min(20,detailQty+Number(el.dataset.change)));document.querySelector('#detail-qty-value').textContent=detailQty;break;case 'gallery':document.querySelectorAll('.gallery-minis button').forEach(b=>{const selected=b===el;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected))});document.querySelector('#detail-photo').classList.toggle('zoomed',el.dataset.view==='close');break;case 'size':selectedSize=el.dataset.size;document.querySelectorAll('.size-option').forEach(b=>b.classList.toggle('active',b===el));const price=getSizePrice(getProduct(new URLSearchParams(location.search).get('id')),selectedSize);document.querySelector('#detail-price').textContent=money(price);document.querySelector('#detail-price-button').textContent=money(price);break;case 'cart-qty':{const i=Number(el.dataset.index);if(cart[i]){cart[i].qty=Math.min(99,cart[i].qty+Number(el.dataset.change));if(cart[i].qty<=0)cart.splice(i,1);saveState();document.querySelector('#drawer-content').innerHTML=cartContent()}break}case 'cart-remove':cart.splice(Number(el.dataset.index),1);saveState();document.querySelector('#drawer-content').innerHTML=cartContent();break;case 'shop-close':closePanels();nav('shop');break;case 'checkout':closePanels();nav('checkout');break;case 'shop-filter':activeFilter=el.dataset.filter;renderShopProducts();break;case 'home-filter':document.querySelectorAll('.collection-tabs .filter-pill').forEach(b=>b.classList.toggle('active',b===el));document.querySelector('#home-products').innerHTML=PRODUCTS.filter(p=>el.dataset.filter==='All'||p.family===el.dataset.filter).map(productCard).join('');initReveal();break;case 'category':activeFilter=el.dataset.filter;nav('shop',{family:el.dataset.filter});break;case 'quiz':quizStep=0;quizAnswers=[];showQuiz();break;case 'quiz-answer':quizAnswers.push(el.dataset.value);quizStep++;showQuiz();break;case 'quiz-restart':quizStep=0;quizAnswers=[];showQuiz();break;case 'quiz-product':closePanels();nav('product',{id});break;case 'search-result':closePanels();nav('product',{id});break;case 'info':infoModal();break;case 'social':showToast('Social channels can be connected at launch.');break;case 'journal-story':showModal(`<button class="modal-close icon-btn" data-action="close">${ic('close',24)}</button><div class="info-modal"><span class="eyebrow">THE JOURNAL</span><h2>${el.dataset.story==='ritual'?'A moment just <em>for you.</em>':'The invisible <em>accessory.</em>'}</h2><p>Some things cannot be seen, yet say everything about us. A favorite scent becomes part of our daily language — a small ritual that turns the ordinary into a memory.</p><button class="text-link" data-action="close">CLOSE ${ic('arrow',17)}</button></div>`);break;}}
);
document.addEventListener('input',e=>{if(e.target.id==='search-input'){const q=e.target.value.trim().toLowerCase();const hits=PRODUCTS.filter(p=>[p.name,p.family,p.mood,...p.notes].join(' ').toLowerCase().includes(q));document.querySelector('#search-results').innerHTML=hits.length?hits.map(p=>`<button data-action="search-result" data-id="${p.id}"><img src="${p.image}" alt=""/><span>${p.name}<small>${p.notes.join(' · ')}</small></span>${ic('arrow',18)}</button>`).join(''):'<p class="no-results">No fragrances found. Try a note like amber, rose or cedar.</p>'}});
document.addEventListener('change',e=>{if(e.target.id==='sort-products'){sortOrder=e.target.value;renderShopProducts()}if(e.target.name==='delivery'){deliveryChoice=e.target.value;updateCheckoutEstimate()}if(e.target.name==='payment'){paymentChoice=e.target.value}});
document.addEventListener('submit',e=>{if(e.target.id==='newsletter-form'){e.preventDefault();showToast('Newsletter subscription will be enabled when the store is connected.');e.target.reset()}if(e.target.id==='contact-form'){e.preventDefault();showToast('Message delivery is not connected yet. No message was sent.')}if(e.target.id==='checkout-form'){e.preventDefault();const total=cart.reduce((n,i)=>n+getSizePrice(getProduct(i.id),i.size)*i.qty,0)+(deliveryChoice==='express'?24:12);showModal(`<button class="modal-close icon-btn" data-action="close" aria-label="Close">${ic('close',24)}</button><div class="info-modal review-modal"><span class="eyebrow gold">YOUR ORDER PREVIEW</span><h2>Beautifully <em>considered.</em></h2><p>Your selection includes <strong>${cart.reduce((n,i)=>n+i.qty,0)} fragrance${cart.reduce((n,i)=>n+i.qty,0)===1?'':'s'}</strong>, with a displayed estimated total of <strong>${money(total)}</strong>.</p><div class="review-breakdown">${cart.map(i=>`<div><span>${getProduct(i.id).name} · ${i.size} × ${i.qty}</span><strong>${money(getSizePrice(getProduct(i.id),i.size)*i.qty)}</strong></div>`).join('')}<div><span>Illustrative delivery</span><strong>${deliveryChoice==='express'?'$24':'$12'}</strong></div></div><p class="checkout-review-warning">No order has been placed, your details have not been submitted to a store, and no payment has been collected.</p><button class="button dark-button" data-action="close">RETURN TO CHECKOUT ${ic('arrow',18)}</button></div>`)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanels()});window.addEventListener('popstate',render);render();

</script>
</body>
</html>
